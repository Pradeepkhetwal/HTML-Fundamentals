<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <!-- A table is simply made of rows and columns -->
    <!-- Here we will use table tag to create a table -->
    <!-- A table tag has 2 parts table head and table body -->
    <!-- In table head we define the  first row i.e headings -->
    <!-- In table body we define the data for the table row wise first we fill row 1 then row 2 so on -->

    <table>
        <thead>
            <!-- tr stands for table row -->
            <tr> 
                <!-- th stands for table headings -->
                <th>Name</th>
                <th>Roll no</th>
                <th>Address</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!-- td stands for table data -->
                <td>Pradeep</td>
                <td>43</td>
                <td>Bageshwar</td>
            </tr>

            <tr>
                <td>Rahul</td>
                <td>33</td>
                <td>Haldwani</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
