<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Id's and Classes</title>
  </head>
  <body>
    <!-- Id are just as same we assign name to our child so that we can identify him in the same way in html we assign id to element  -->
    <!-- An element can not be assigned more than one id -->
    <!-- In a website 2 elements cannot have same id -->
    <!-- The main purpose of assigning a id is that we can easily make changes in that particular element of a website by using js and css-->
    <!-- id is assigned by using # just write the element and then type '#' and provide the id to that element -->

    <div id="first">I am div with id first</div>
    <span id="second">I am span with id second</span>

    <!-- Classes -->
    <!-- Same classes can be assigned to multiple elements -->
    <!-- An Element can have more than 2 classes -->
    <!-- Suppose we want to provide red background to multiple element so we can do this by simply providing these 
    elements the same class and then the properties we define for that class will be occupied by the elements belonging to that class so it makes the easy use of css and js -->
    <!-- To assign classes just write the name of tag the '.' name of class -->
    <!-- When you want to assign multiple classes simple write the tag name then '.' classname then'.' then second class name and so on -->

    <div class="redbg">I am div whose class is redbg</div>
    <div class="redbg bluebg greenbg">
      I am div with 3 classes redbg bluebg greenbg
    </div>
  </body>
</html>
