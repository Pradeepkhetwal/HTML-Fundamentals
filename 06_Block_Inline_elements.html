<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block and Inline elements</title>
</head>
<body>
    <!-- Elements occupy the whole line are called as block elements , paragraph is a block element -->
    <!-- Elements or tags occupying only the required space are called as Inline elements these tags or elements can be put next to each other if space is there , span is a Inline element-->
    <p>first line in paragraph tag</p>
    <p>second line in pargarph tag</p>
    <hr>
    <span>First line of span</span>
    <span>Second line of span</span>

     <!-- Anchor tag is an Inline element -->
    <a>I am anchor tag</a>
    <a> I am anchor tag</a>
   
    <!-- Div is an Block element -->
    <div>I am div</div>
    <div>I am div2</div>

    <em>I am em tag</em>
    <em>I am em 2 </em>

    <li>I am li</li>
    <li>I am li 2</li>
</body>
</html>
