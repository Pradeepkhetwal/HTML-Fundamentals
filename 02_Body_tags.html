<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Below is the bold tag -->
    <b>This is bold</b><br>

    <!-- Italic tag -->
    <I>This is Italic</I><br>

    <!-- Instead of bold and italic it is recommended to use strong and em tags -->

    <!-- Strong tag  it is same as bold tag-->
    <strong>This is strong</strong><br>


    <!-- Em tag it is same as em tag-->
    <em>This is em</em><br>
</body>
</html>
