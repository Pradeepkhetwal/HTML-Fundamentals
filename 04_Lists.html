<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List</title>
  </head>
  <body>
    <!-- List -->
    <!-- In html there are 2 types of lists -->
    <!-- Ordered List and Unordered list -->
    <!-- A list can be nested inside another list -->
    <!-- List also have attribute which can be used by writing type command -->

    <!-- Unordered List -->
    <ul>
      <li>first item of Unordered list</li>
      <li>second item of Unordered list</li>
      <ol>
        <li>nested list</li>
      </ol>
      <li>third item of Unordered list</li>
    </ul>

    <!-- Ordered List -->
    <!-- We have used attribute here i.e type = "A" -->
    <ol type="A">
      <li>first item of ordered list</li>
      <li>second item of ordered list</li>
      <li>third item of ordered list</li>
    </ol>
  </body>
</html>
