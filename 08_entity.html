<!--  Entities kuch nahi hai ek simple topic hai jisme hum reserved keyword ko with the help of a specific code (jo ki & se start hota hai or ; se khatam hota hai ) display karte hai .. simply write html entities in google and you will understand -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entity in html</title>
  </head>
  <body>
    <!-- Entity in html is a piece of string due to which we can display reserved characters symbols and blankspaces 
     -->
    <!-- Usually entity starts with '&' symbol and ends with a semicolon ';' -->

    <div class="brown">
      <p>This is a paragraph</p>
      <!-- Here in the output of the webpage we will not see any spaces -->
    </div>

    <!-- nbsp is an entity also called as non breaking space which is used to display spaces between the words in a paragraph one nbsp is equivalent to one space so here we have used 5 nbsp so 5 spaces will be represented . -->

    <!-- nbsp is not recommended to use we use css to provide spaces between text. -->
    <div class="red">
      <p>This is also a &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; paragraph</p>
    </div>

    <!-- HTML entites are also very helpful in displaying logos like of copyright , and many other which can be displayed by html entities-->

    <!-- Just google html entites to know about the entites for reserved characters -->

    <!-- Invisible character is also represented by the help of html entities. -->

    <div class="learn">
      <p>The copyright logo is &copy;</p>
      <p>The registered logo is &reg;</p>
      <p>The euro currency symbol is &euro;</p>
      <p>The dollar currency symbol is &dollar;</p>
    </div>
  </body>
</html>
